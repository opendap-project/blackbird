schema = "opendap.requirements/v1"

[[block]]
markdown = "# UI components requirements\n\nRequirements for the official UI components and design system of Blackbird OS.\n"

[[block]]
[[block.requirement]]
id = "DS-001"
text = "All Blackbird OS UI shall follow the official design system."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-002"
text = "Typography: IBM Plex (Sans for the interface, Serif italic for reading and notes, Mono for data)."
priority = "should"
status = "withdrawn"
[[block.requirement]]
id = "DS-003"
text = "Color: warm black #0E0D0C and ivory #F3EFE7, with one accent per activity (Listen #F0A63C, Watch #7DB3E8, Read #A3C98F, Create #EE7E62, Day #6CC4B4, Advanced #B7A4F0)."
priority = "should"
status = "withdrawn"
[[block.requirement]]
id = "DS-004"
text = "Layout anatomy: status bar, a strip of activities (the active one large, the others peeking) and a 60 px playback thread at the bottom, replacing tabs and icons."
priority = "should"
status = "withdrawn"
[[block.requirement]]
id = "DS-005"
text = "Reference screen: 480 × 800 portrait; some views landscape 800 × 480."
priority = "should"
status = "withdrawn"
[[block.requirement]]
id = "DS-006"
text = "Components and templates shall be i18n-first: no hard-coded text, room for text expansion, mirrored layouts for right-to-left languages, and script-aware typography (SYS-025)."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-007"
text = "The design system shall define one official theme, with its tokens and templates structured so community themes can replace them without code (SYS-030)."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-008"
text = "The [design system spec](../specs/design-system.md) shall be the reference for all Blackbird OS UI, OpenDAP Desktop, documentation visuals and product renders; its tokens file is the single source of design values."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-009"
text = "Plasma and thermal effects shall be a special visual mode, never used on routine screens (lists, settings, ordinary cards), and the UI shall offer a reduced-effects mode that replaces them with static or flat equivalents without losing information."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-010"
text = "Text shall meet WCAG 2 AA contrast against its background in every theme, and no state shall be communicated by colour alone."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-011"
text = "Typography shall define its roles (interface, technical values) and cover the scripts of every shipped language, starting with Latin, Han, Devanagari and Arabic (SYS-028), with right-to-left mirroring."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-012"
text = "Motion shall respect the reduce-motion setting: animation is replaced by a static state, never by the loss of the feedback it carried."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-013"
text = "Button groups, physical and digital, shall use the segmented-capsule pattern: one capsule split into segments with rounded outer ends and flat inner edges."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-014"
text = "Touch targets, spacing and layout shall be sized in millimetres for the T1's 3.5\" panel and one-handed thumb use, not scaled from a phone layout."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-015"
text = "The type scale shall be sized for a 35 cm reading distance: text that must be read meets 16 minutes of arc of cap height at that distance, and nothing is smaller than the `caption` role."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-016"
text = "Each shipped script shall have its own minimum sizes and line heights, as per-locale tokens."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-017"
text = "Layouts shall use the T1's side margin and space elements by proximity (within a unit, within a group, between groups), never with one default gap."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-018"
text = "Each kind of control shall keep its job: tabs for navigation, button groups for related actions or a value, toggles for one setting, list lines to go somewhere, one primary action per screen."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-019"
text = "Icons shall come from one open icon set, at whole-pixel strokes, with visible labels except for the standard transport, volume and status glyphs, and an accessible name on every icon-only control."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-020"
text = "Long text shall be cut with an ellipsis, never scrolled automatically, and its full text shall always be reachable."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-021"
text = "OpenDAP shall have its own icon library, addressed by semantic names, which themes and derivatives can redraw icon by icon."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "DS-022"
text = "The design system shall be defined for any display and input set, in units that keep physical size and visual angle (design pixels), with layout classes each optimised for its characteristics; the T1 is the reference, not the rule."
priority = "must"
status = "confirmed"

[[block]]
markdown = "\n## Context\n\n- DS-022: the UI and design system must not assume one hardware's characteristics as the only valid ones, while seeking the best optimisation for each (SYS-068, system ADR 0013). Design system §18.2.\n- DS-021: built as OpenDAP Icons over Tabler Icons, used as upstream draws them, with OpenDAP's own glyphs only where Tabler has none ([ADR 0001](../adr/0001-tabler-icons-as-the-base-family.md), [`icons/`](../../icons/README.md)); replacement by name covers customisation.\n- DS-015 to DS-020: values in the [design system](../specs/design-system.md) §8.3, §9.3, §9.6, §9.7, §10.1 and §15.\n- DS-014: a 3.5\" screen is not a phone; the values are in the design system §8.3.\n- DS-008 to DS-012: from the maintainers' design direction, reconciled with the decisions already taken (Slint renderer, 166 ppi panel, 60 fps budget, status LED colours, five shipped languages).\n- DS-013: the T1's Volume + / Volume − pair (T1-059) is the reference instance; on screen it covers button groups and segmented controls such as gain, filter, output or mode selectors.\n"
