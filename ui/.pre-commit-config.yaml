# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/opendap-project/toolkit-hooks
    rev: v0.4.1
    hooks:
      - id: no-stray-files
  # Generated files are current: each generator's --check fails when its outputs are stale.
  - repo: local
    hooks:
      - id: tokens-current
        name: design tokens generated (tokens/generate.py --check)
        entry: python3 tokens/generate.py --check
        language: system
        pass_filenames: false
        files: ^(tokens/|export/(slint|css)/|docs/reference/tokens\.md$)
      - id: tokens-tests
        name: token reference (tokens/test_generate.py)
        entry: python3 -m unittest tokens/test_generate.py
        language: system
        pass_filenames: false
        files: ^tokens/
      - id: icons-current
        name: icons generated (icons/icons.py --check)
        entry: python3 icons/icons.py --check
        language: system
        pass_filenames: false
        files: ^(icons/|export/icons/|renders/web/icons\.html$)
      - id: icons-tests
        name: status glyphs on the pixel grid (icons/test_pixelgrid.py)
        entry: python3 -m unittest icons/test_pixelgrid.py
        language: system
        pass_filenames: false
        files: ^(icons/|export/icons/16/)
  # The requirements README is rendered from requirements.toml and checked.
  - repo: local
    hooks:
      - id: requirements-current
        name: requirements README rendered (odapkit req render --check)
        entry: odapkit req render docs/requirements/requirements.toml --check
        language: system
        pass_filenames: false
        files: ^docs/requirements/
