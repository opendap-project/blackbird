version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "**/README.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["brand/**", "export/brand/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "brand/*.py"
precedence = "override"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["export/fonts/*.ttf", "export/fonts/*.otf", "export/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "icons/vendor/tabler-icons/**"
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Paweł Kuna"
SPDX-License-Identifier = "MIT"
