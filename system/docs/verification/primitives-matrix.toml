# The combinatorial matrix of the composer's primitives: one case per row, kept up to date as
# cases are tried. Rendered by odapkit verify into primitives-matrix.md. Status: verified (in the
# running product, on the virtual T1), unit (tests only, with the reason), gap (found, open),
# open (not tried yet), blocked (cannot be produced here, with the reason), na.
# Levels (ADR 0014): where the case runs again on demand. L0 unit, L1 property, L2 headless
# interface, L3 scripted scenario on the virtual T1, L4 device; L3m: tried by hand on the virtual
# T1, which proves it once but does not run again (a case only at L3m is not done).

schema = "opendap.verification/v1"

[matrix]
title = "The composer's primitives: combinatorial matrix"
intro = "Every combination of a primitive with the conditions it meets (input source, focus shown or hidden, right to left, reduce motion, disabled, the blueprint, the display off, reduce transparency) that makes sense together, one case per row, with what was expected, what was seen and where the evidence is. Kept up to date as cases are tried (the composer and UI runtime spec's verification; the global definition of done: verified in the running product)."
level_note = "(ADR 0014): where a case runs again on demand."
level_after = "A case seen only by hand (L3m) is not done until a level that runs again covers it."
done_label = "verified or covered by tests"
done = ["verified", "unit"]
manual = ["L3m"]

[[matrix.status]]
id = "verified"
meaning = "verified in the running product (virtual T1)"

[[matrix.status]]
id = "unit"
meaning = "tests only, with the reason"

[[matrix.status]]
id = "gap"
meaning = "found and open"

[[matrix.status]]
id = "open"
meaning = "not tried yet"

[[matrix.status]]
id = "blocked"
meaning = "cannot be produced here, with the reason"

[[matrix.status]]
id = "na"
meaning = "does not apply"

[[matrix.level]]
id = "L0"
meaning = "unit"

[[matrix.level]]
id = "L1"
meaning = "property"

[[matrix.level]]
id = "L2"
meaning = "headless interface"

[[matrix.level]]
id = "L3"
meaning = "scripted scenario on the virtual T1"

[[matrix.level]]
id = "L4"
meaning = "device"

[[matrix.level]]
id = "L3m"
meaning = "tried by hand on the virtual T1: proven once, does not run again"

