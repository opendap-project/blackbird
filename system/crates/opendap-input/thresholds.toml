# The thresholds of input events §7: the one source of src/thresholds.rs and of the §7 table in
# docs/specs/input-events.md, both generated by tools/thresholds.py (run it after editing; the
# pre-commit hook thresholds-generated checks both are current).
#
# [[constant]]: a Rust constant. `type` is its Rust type, `value` its default (or `same_as`, another
# constant), `doc` its source or rationale, kept as the doc comment.
# [[row]]: a row of the §7 table. `default` names constants as {NAME}, or {NAME|s} for milliseconds
# written in seconds and {NAME|per_s} for an interval in milliseconds written as a rate per second.

module_doc = """
The thresholds of input events §7, in design pixels and milliseconds: defaults, adjustable
(SYS-066), lengthened and never shortened by accessibility settings."""

[[constant]]
name = "SLOP_PX"
type = "f32"
value = 10.0
doc = "How far a contact may move and still be a tap or a long press, in design pixels."

[[constant]]
name = "LONG_MS"
type = "u64"
value = 500
doc = "Short against long (T1 controls spec §1.1; proposed, Android's default is 400 ms since 12)."

[[constant]]
name = "EDGE_PX"
type = "f32"
value = 20.0
doc = "The side and bottom edge-gesture zones (design system §8.5), in design pixels."

[[constant]]
name = "STATUS_BAR_PX"
type = "f32"
value = 28.0
doc = """
The top zone is the status bar: "swipe down from the status bar" (SYS-039, design system
§8.5), the `size.status-bar` token."""

[[constant]]
name = "FLING_PX_S"
type = "f32"
value = 50.0
doc = """
A pan ends as a swipe when it is released faster than this, in design pixels per second
(Android's `MINIMUM_FLING_VELOCITY`)."""

[[constant]]
name = "VELOCITY_MS"
type = "u64"
value = 100
doc = "The window the release velocity is measured over (Android's `VelocityTracker` horizon)."

[[constant]]
name = "HOLD_MS"
type = "u64"
value = 2000
doc = "Held for deliberate system actions (T1 controls spec §1.1; proposed)."

[[constant]]
name = "REPEAT_DELAY_MS"
type = "u64"
value = 400
doc = """
A held control's repeat: after the delay, the first step, then each interval this fraction of
the last, down to the fastest; it stops where it is released (composer spec §2, maintainers)."""

[[constant]]
name = "REPEAT_FIRST_MS"
type = "f64"
value = 250.0

[[constant]]
name = "REPEAT_FACTOR"
type = "f64"
value = 0.8

[[constant]]
name = "REPEAT_FASTEST_MS"
type = "f64"
value = 50.0

[[constant]]
name = "DOUBLE_TAP_MS"
type = "u64"
value = 300
doc = "A double tap, only where an element opts in (§3.2)."

[[constant]]
name = "DOUBLE_PRESS_MS"
type = "u64"
same_as = "DOUBLE_TAP_MS"
doc = """
A control's double press, only where its context gives one (the volume buttons while they are
the volume, T1-062): the same window as a double tap (Android's `DOUBLE_TAP_TIMEOUT`)."""

[[constant]]
name = "KEY_REPEAT_DELAY_MS"
type = "u64"
value = 600
doc = "An attached keyboard's repeat (X11's and GNOME's defaults)."

[[constant]]
name = "KEY_REPEAT_EVERY_MS"
type = "u64"
value = 40

[[row]]
threshold = "Touch slop"
default = "{SLOP_PX} px"
from = "Android's 8 dp, at the T1's reading distance"

[[row]]
threshold = "Long press"
default = "{LONG_MS} ms"
from = "T1 controls spec §1.1; proposed (Android's default has been 400 ms since Android 12)"

[[row]]
threshold = "Hold"
default = "{HOLD_MS|s} s"
from = "T1 controls spec §1.1"

[[row]]
threshold = "Double-tap"
default = "{DOUBLE_TAP_MS} ms"
from = "Android `DOUBLE_TAP_TIMEOUT`"

[[row]]
threshold = "Double press (a control, where its context gives one)"
default = "{DOUBLE_PRESS_MS} ms after a short first press's release"
from = "the same timeout; T1-062"

[[row]]
threshold = "Fling velocity"
default = "{FLING_PX_S} px/s minimum, over the last {VELOCITY_MS} ms"
from = "Android `MINIMUM_FLING_VELOCITY`, `VelocityTracker`"

[[row]]
threshold = "Edge zone"
default = "{EDGE_PX} px at the sides and the bottom; the status bar's {STATUS_BAR_PX} px at the top"
from = "Design system §8.5"

[[row]]
threshold = "Keyboard repeat"
default = "{KEY_REPEAT_DELAY_MS} ms, then {KEY_REPEAT_EVERY_MS|per_s} per second; modifiers never repeat"
from = "X11's and GNOME's defaults"

[[row]]
threshold = "Repeat"
default = "{REPEAT_DELAY_MS} ms, then {REPEAT_FIRST_MS} ms × {REPEAT_FACTOR} down to {REPEAT_FASTEST_MS} ms; it stops on release, with no inertia"
from = "Composer spec §2 (maintainers)"
