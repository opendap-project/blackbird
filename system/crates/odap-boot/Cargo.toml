[package]
name = "blackbird-apps-boot"
version = "0.0.1"
description = "Blackbird OS boot UI: what the screen shows between the boot loader and the composer (splash screen; later the boot-mode menu, offline updates, checks)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Installed as /usr/lib/blackbird/boot (RFC 0017 §3: an internal daemon, no prefix).
[[bin]]
name = "boot"
path = "src/main.rs"

[dependencies]
blackbird-platform.workspace = true
blackbird-device.workspace = true
blackbird-ui-splash.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The same versions Smithay uses, so the build has one copy of each.
drm = "0.14.1"
rustix = { version = "1.1.5", features = ["fs", "time", "event"] }
