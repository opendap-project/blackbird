[package]
name = "blackbird-composer"
version = "0.0.1"
description = "Blackbird OS compositor and system layers (bring-up)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Installed as /usr/lib/blackbird/composer (RFC 0017 §3: an internal daemon, no prefix).
[[bin]]
name = "composer"
path = "src/main.rs"

[dependencies]
blackbird-platform.workspace = true
blackbird-device.workspace = true
blackbird-ui-input.workspace = true
blackbird-ui-motion.workspace = true
blackbird-ui-splash.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
tracing-journald.workspace = true
# Smithay's event loop, with its signal source (SIGTERM: hand the display over before exiting).
calloop = { version = "0.14", features = ["signals"] }
# The kernel's uevents and the local time for the status bar (status.rs).
libc = "0.2"
# The system layers, drawn by Slint's software renderer into a buffer the compositor places above
# every client (ADR 0002, spec §7).
slint = { workspace = true, features = ["std", "compat-1-2", "renderer-software"] }
# Screenshots (Main + Volume −) as PNG.
png = "0.18"

[build-dependencies]
opendap-workspace.workspace = true
slint-build.workspace = true
