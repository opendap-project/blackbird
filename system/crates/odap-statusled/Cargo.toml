[package]
name = "blackbird-apps-statusled"
version = "0.0.1"
description = "Blackbird OS status LED: shows the highest-priority state of the device on the faceplate's status LED (T1 controls spec §2)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Installed as /usr/lib/blackbird/statusled (RFC 0017 §3: an internal daemon, no prefix).
[[bin]]
name = "statusled"
path = "src/main.rs"

[dependencies]
blackbird-platform.workspace = true
blackbird-device.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
