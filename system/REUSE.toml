precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "schemas/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# SDK crates: libraries others build on (device model, platform contract, UI primitives, audio measurements)
[[annotations]]
path = ["crates/opendap-bus-model/**", "crates/opendap-device/**", "crates/opendap-input/**", "crates/opendap-layout/**", "crates/opendap-motion/**", "crates/opendap-forms/**", "crates/opendap-media/**", "crates/opendap-audio-analysis/**", "crates/opendap-platform/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "MPL-2.0"
