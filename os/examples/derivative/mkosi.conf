# Minimal derivative of Blackbird OS (docs/derivatives.md): it includes the Blackbird OS image definition
# unchanged and only sets what makes it a different system. Settings after Include= override the included ones.
[Include]
Include=../../image

[Output]
ImageId=example-os
# Its own output and cache directories, so building it never touches the Blackbird OS ones.
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache
# Read after Blackbird OS's image/mkosi.env, so these OS_* values win. (A file named mkosi.env would be
# read before the included one and lose.)
EnvironmentFiles=identity.env

[Content]
Hostname=example-os
# overlay/ is copied after Blackbird OS's trees, so its files win: themes, configuration, drivers.
# (A tree named mkosi.extra would be copied before the included ones and lose.)
ExtraTrees=overlay
