# Blackbird OS image definition (mkosi). One definition, several outputs selected by profile:
#   qemu, oci, sysroot   # virtual T1, container, cross-build sysroot (implemented)
#   t1                   # device image (not implemented yet)
# Build a profile with toolkit-image: odapkit image build <profile>
[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64
# deb.debian.org (Fastly) intermittently serves empty bodies for large packages; use the kernel.org mirror.
Mirror=https://mirrors.edge.kernel.org/debian

[Output]
ImageId=blackbird-os
OutputDirectory=mkosi.output
# Package manifest, read by toolkit-image odapkit-security-check.
ManifestFormat=json

[Build]
# Downloaded packages are reused between builds.
CacheDirectory=mkosi.cache

[Content]
# Bootable profiles add the kernel, from trixie-backports (blackbird-os ADR 0002); see mkosi.sandbox/ and mkosi.extra/.
Packages=
        systemd
        systemd-sysv
        # Grows the root partition at boot to fill its storage (usr/lib/repart.d).
        systemd-repart
        udev
        dbus
        openssh-server
        iproute2
        less
        ca-certificates
# Kernel modules: every module of Debian's kernel stays (USB peripherals, HAT chips, radio and
# storage HATs can need any of them), except families that serve no OpenDAP device, HAT or
# peripheral: datacenter fabrics and storage adapters, cluster file systems, hypervisor guests,
# datacenter network cards and PC graphics cards (OS-021). About 19 MB of 80 MB.
KernelModulesExclude=
        ^drivers/infiniband/
        ^net/(rds|smc|ceph)/
        ^drivers/scsi/(qla2xxx|qla4xxx|lpfc|bfa|qedf|qedi|bnx2fc|bnx2i|csiostor|cxgbi|be2iscsi|megaraid|mpt3sas|mpi3mr|aacraid|hpsa|smartpqi|pm8001|isci|fnic|snic|esas2r|arcmsr|aic7xxx|aic79xx|aic94xx|ipr|elx|hisi_sas|mvsas|libsas)
        ^drivers/target/
        ^drivers/nvme/target/
        ^fs/(ocfs2|gfs2|ceph|dlm|orangefs|coda)/
        ^drivers/(xen|hv)/
        ^drivers/net/(xen-netback|hyperv)/
        ^drivers/net/ethernet/(mellanox|broadcom/bnxt|chelsio|qlogic|emulex|huawei|cavium|marvell/octeontx2|amazon|google|microsoft|cisco|netronome|sfc|pensando|fungible)/
        ^drivers/gpu/drm/(amd|radeon|nouveau|ast|mgag200|qxl|hisilicon|xe|i915|vmwgfx)/
# After the system's identity (mkosi.postinst.chroot): the documentation and translations dpkg's
# filters could not reach.
PostInstallationScripts=scripts/slim.postinst.chroot
Hostname=blackbird-os
Locale=C.UTF-8
Timezone=UTC
