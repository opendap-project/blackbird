# Home of the Blackbird OS session user (caches such as the GPU shader cache).
d /var/lib/blackbird 0700 odap odap -
# The run directory (blackbird-platform run): the debug switches, and the testbed's debug jump, which a
# developer or a test writes as root.
d /run/blackbird 0755 root root -
d /run/blackbird/debug 0755 root root -
d /run/blackbird/testbed 0755 root root -
