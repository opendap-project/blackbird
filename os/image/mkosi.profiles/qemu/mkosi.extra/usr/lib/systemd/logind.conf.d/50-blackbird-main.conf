# The `main` control belongs to the composer (system composer and UI runtime spec §2; T1 controls spec
# §1.3): a short press turns the display off or on, a long press opens the power menu. logind
# handles none of its presses. Forced power-off does not depend on software: the board's PMIC cuts
# the power when `main` is held (the virtual board's in odap-vdev).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
