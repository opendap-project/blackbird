# The debug boot mode: the only boot that shows consoles (a login on the screen and on the serial
# port) and full boot messages. Reached by holding Space while booting (the boot menu is hidden),
# or with `bootctl set-oneshot` before a reboot.
[UKIProfile]
Profile=ID=debug
        TITLE=Blackbird OS (debug)
Cmdline=blackbird.debug loglevel=7 systemd.show_status=true vt.global_cursor_default=1
