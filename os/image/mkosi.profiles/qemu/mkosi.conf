# Virtual T1 for development: UEFI disk image booted by QEMU (aarch64 virt).
[Output]
Output=blackbird-os-qemu
Format=disk

[Build]
# The test_power build script downloads its pinned source.
WithNetwork=yes

[Content]
# From libpam-systemd on: the composer's session and display stack (odap-composer.service): a logind
# session through PAM with its session bus (dbus-user-session; accessibility reaches screen readers
# through it, AT-SPI), DRM/KMS with GBM and EGL (Mesa, which renders in software when the virtual
# GPU has no 3D), libinput and libseat, and Wayland for the product host.
Bootable=yes
Bootloader=systemd-boot
Packages=
        linux-image-arm64
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        sudo
        libpam-systemd
        dbus-user-session
        libgbm1
        libegl1
        libegl-mesa0
        libgles2
        libgl1-mesa-dri
        libinput10
        libseat1
        libxkbcommon0
        libwayland-client0
        libwayland-server0
        libwayland-egl1
        libfontconfig1
# ALSA's tools (aplay, arecord, amixer) on the virtual board, to test its output and the
# faceplate's microphone from the guest.
Packages=alsa-utils
# A product boot shows no text: kernel and systemd messages go to the serial console only, quietly,
# with no cursor on the screen; the screen shows the splash screen (odap-boot) and then the interface.
# The "Debug" UKI profile (mkosi.uki-profiles/) is the only boot with consoles and full messages.
KernelCommandLine=console=ttyAMA0 quiet loglevel=3 rd.udev.log_level=3
        systemd.show_status=false vt.global_cursor_default=0
# Inputs from other repositories are passed by the build tool (toolkit-image odapkit-image), never
# written here: the development key tree (root over SSH, never in device images) and the virtual
# board's support package (virtual-devices export/bsp), whose device description comes from the
# running model through fw_cfg, so this image runs every virtual model.
# The kernel lives in the unified kernel image; Debian's own copies on the ESP are not booted.
RemoveFiles=/boot/vmlinuz-*
        /boot/config-*
        /boot/System.map-*
# Virtual battery: build the kernel's test_power module (see scripts/test-power.build.chroot).
BuildPackages=
        linux-headers-arm64
        build-essential
        curl
BuildScripts=scripts/test-power.build.chroot
PostInstallationScripts=scripts/depmod.postinst.chroot
        scripts/session.postinst.chroot
