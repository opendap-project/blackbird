# Cross-compilation sysroot for developer hosts: the same Debian packages as the image, plus the
# headers and link libraries Blackbird OS software builds against. Not bootable, never shipped.
# A tar, because macOS volumes are case-insensitive by default: toolkit-image odapkit-sysroot unpacks it
# into a case-sensitive volume on the host, where odapkit-cross links against it.
[Output]
Output=blackbird-os-sysroot
Format=tar

[Content]
Bootable=no
Packages=
        libc6-dev
        libudev-dev
        libinput-dev
        libseat-dev
        libdrm-dev
        libgbm-dev
        libegl-dev
        libgles-dev
        libwayland-dev
        libxkbcommon-dev
        libfontconfig-dev
        libasound2-dev
        pkgconf
