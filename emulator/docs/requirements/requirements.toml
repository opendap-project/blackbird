schema = "opendap.requirements/v1"

[[block]]
markdown = "# Virtual devices requirements\n\nRequirements for the virtual OpenDAP devices that run on a developer host.\n"

[[block]]
[[block.requirement]]
id = "VD-001"
text = "A virtual device shall mimic its hardware as closely as possible: display, controls, touch, audio output, battery and charging, storage, microSD, USB in host and device mode, networking, and the coprocessor and HAT presence where they can be emulated."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-002"
text = "A virtual device shall work with the `opendap` CLI and OpenDAP Desktop running on the host, as the hardware would."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-003"
text = "A virtual device shall have network access, to the local network and to the internet."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-004"
text = "Virtual devices shall live in their own repository, separate from the toolkit and from the operating system."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-005"
text = "A virtual device shall be organised by its hardware: a combination of hardware layers (SoC, board, components, faceplate, HATs), with the device model defined on top of that combination."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-006"
text = "Everything that lets a device be emulated on the host during development shall be provided, for every requirement, as far as possible; what cannot be emulated is shown by the toolkit (cli TK-018)."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-007"
text = "The window of a virtual device shall always open at the right size, and keep it while the device boots."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-008"
text = "The simulator window shall instrument the virtual device's sound on demand: what it plays and what it records, as level meters, a spectrum and a sine's distortion (THD, THD+N, SNR), measured on the stream exactly as the device produced it, so the audio path's audiophile qualities can be audited."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-009"
text = "The guest's recorded input shall be selectable among every input of the host, a test signal and silence."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "VD-010"
text = "Instrumentation should cover the hardware's signals, not only the operating system's view: each hardware layer should declare the signals it carries (the stream from the SoC to the DAC, the DAC's output, the microphone's converter, buses, GPIOs, LEDs, power rails), and each one a layer models should be observable in the simulator under the same name a probe uses on the hardware."
priority = "should"
status = "draft"
[[block.requirement]]
id = "VD-011"
text = "The simulator window should offer a task manager for the virtual device: every process with its state, CPU and memory, sorted by any of them, and the usual actions on one (end, kill, pause, resume, priority)."
priority = "should"
status = "confirmed"

[[block]]
markdown = "\n## Context\n\n- VD-001 to VD-003 were blackbird-os OS-018, OS-033 and OS-034 (moved with VD-004).\n- VD-004 to VD-007. VD-005 applies the system hardware support spec's layers (H0 to H5) to virtual hardware: one image runs every virtual model, because the model's description comes from the virtual board (fw_cfg), as a real board is identified by its hardware.\n- VD-007: \"the right size\" is the panel's pixels at 1:1, so the picture stays crisp; on a 34-inch 3440 × 1440 monitor that is already larger than the T1's panel (about 74 mm against 49 mm wide).\n- VD-008 to VD-011: debugging sound in the simulator with the same analysis used for motion, above all the output, to audit its audiophile qualities; the inputs selectable among all the host's sources once a real input is bridged; instrumentation of any signal, the hardware's as well as the system's (for example the music that leaves the SoC for the DAC by its own interface); a task manager as its own tab, as on Windows or a typical Linux. How the sound reaches the window: [ADR 0003](../adr/0003-sound-over-dbus.md).\n- An audio file as an input source (the guest records a file played into its microphone) was raised as an idea; not built.\n- Specification: [virtual devices](../specs/virtual-devices.md).\n"
