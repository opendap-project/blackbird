# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/opendap-project/toolkit-hooks
    rev: v0.3.0
    hooks:
      - id: no-stray-files
  # Shell scripts (found by their shebang): shellcheck, pinned through shellcheck-py.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # The requirements README is rendered from requirements.toml and checked.
  - repo: local
    hooks:
      - id: requirements-current
        name: requirements README rendered (odapkit req render --check)
        entry: odapkit req render docs/requirements/requirements.toml --check
        language: system
        pass_filenames: false
        files: ^docs/requirements/
  # Rust, in the viewer (host) and board (guest) workspaces: rustfmt on commit, clippy and tests before push.
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt --check on changed Rust files
        entry: rustfmt --check --edition 2024
        language: system
        types: [rust]
      - id: clippy
        name: cargo clippy -D warnings, viewer and board (before push)
        entry: sh -c 'cargo clippy --manifest-path viewer/Cargo.toml --workspace --all-targets -q -- -D warnings && cargo clippy --manifest-path board/Cargo.toml --workspace --all-targets -q -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
      - id: cargo-test
        name: cargo test, viewer and board (before push)
        entry: sh -c 'cargo test --manifest-path viewer/Cargo.toml --workspace -q && cargo test --manifest-path board/Cargo.toml --workspace -q'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
