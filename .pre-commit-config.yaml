# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/opendap-project/tools
    rev: v0.1.0
    hooks:
      - id: no-stray-files
  # Shell scripts (found by their shebang): shellcheck, pinned through shellcheck-py.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(?:emulator|os)/
  # emulator/
  - repo: local
    hooks:
      # The requirements README is rendered from requirements.toml and checked.
      - id: requirements-current-emulator
        name: emulator requirements README rendered (odapkit req render --check)
        entry: sh -c 'cd emulator && odapkit req render docs/requirements/requirements.toml --check'
        language: system
        pass_filenames: false
        files: ^emulator/docs/requirements/
      # Rust, in the viewer (host) and board (guest) workspaces: rustfmt on commit, clippy and tests before push.
      - id: rustfmt-emulator
        name: emulator rustfmt --check on changed Rust files
        entry: rustfmt --check --edition 2024
        language: system
        types: [rust]
        files: ^emulator/
      - id: clippy-emulator
        name: emulator cargo clippy -D warnings, viewer and board (before push)
        entry: sh -c 'cd emulator && cargo clippy --manifest-path viewer/Cargo.toml --workspace --all-targets -q -- -D warnings && cargo clippy --manifest-path board/Cargo.toml --workspace --all-targets -q -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
        files: ^emulator/
      - id: cargo-test-emulator
        name: emulator cargo test, viewer and board (before push)
        entry: sh -c 'cd emulator && cargo test --manifest-path viewer/Cargo.toml --workspace -q && cargo test --manifest-path board/Cargo.toml --workspace -q'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
        files: ^emulator/
  # os/
  - repo: local
    hooks:
      # The requirements README is rendered from requirements.toml and checked.
      - id: requirements-current-os
        name: os requirements README rendered (odapkit req render --check)
        entry: sh -c 'cd os && odapkit req render docs/requirements/requirements.toml --check'
        language: system
        pass_filenames: false
        files: ^os/docs/requirements/
      # The command-line contract of the image's commands and build scripts, on the host (no device, no build VM).
      - id: cli-contract
        name: os command-line contract (tests/cli.sh)
        entry: sh -c 'cd os && tests/cli.sh'
        language: system
        pass_filenames: false
        files: ^os/(image/mkosi\.extra/usr/bin|image/mkosi\.profiles/[^/]+/scripts|tests)/
  # system/
  - repo: local
    hooks:
      - id: primitives-matrix
        name: system primitives matrix rendered from its data
        entry: sh -c 'cd system && odapkit verify render docs/verification/primitives-matrix.toml --check'
        language: system
        files: ^system/docs/verification/
        pass_filenames: false
      - id: primitives-matrix-checks
        name: system primitives matrix names the checks that prove its cases (tests/matrix_checks.py --check)
        entry: sh -c 'cd system && tests/matrix_checks.py --check'
        language: system
        files: ^system/(docs/verification/|tests/e2e/scenarios\.py|crates/odap-testbed/tests/interface(\.rs|/))
        pass_filenames: false
      - id: requirements-rendered
        name: system requirements README rendered (odapkit req render --check)
        entry: sh -c 'cd system && odapkit req render docs/requirements/requirements.toml --check'
        language: system
        pass_filenames: false
        files: ^system/docs/requirements/
      - id: key-names-generated
        name: system key_names.rs generated from the kernel header (key_names.py --check)
        entry: sh -c 'cd system && python3 crates/odap-composer/tools/test_key_names.py -q && python3 crates/odap-composer/tools/key_names.py --check'
        language: system
        pass_filenames: false
        files: ^system/crates/odap-composer/(tools/|src/linux/key_names\.rs$)
      - id: thresholds-generated
        name: system thresholds.rs and input-events §7 generated from thresholds.toml (thresholds.py --check)
        entry: sh -c 'cd system && python3 crates/opendap-input/tools/test_thresholds.py -q && python3 crates/opendap-input/tools/thresholds.py --check'
        language: system
        pass_filenames: false
        files: ^system/(crates/opendap-input/(thresholds\.toml|tools/|src/thresholds\.rs)|docs/specs/input-events\.md)$
      - id: e2e-tokens
        name: system the e2e scenarios' design tokens read from Blackbird UI (test_tokens.py)
        entry: sh -c 'cd system && python3 tests/e2e/test_tokens.py -q'
        language: system
        pass_filenames: false
        files: ^system/tests/e2e/(tokens|test_tokens|device)\.py$
      - id: rustfmt-system
        name: system rustfmt --check on changed Rust files
        entry: rustfmt --check --edition 2024
        language: system
        types: [rust]
        files: ^system/
      - id: clippy-system
        name: system cargo clippy -D warnings (before push)
        entry: sh -c 'cd system && cargo clippy --workspace --all-targets -q -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
        files: ^system/
      - id: cargo-test-system
        name: system cargo test (before push)
        entry: sh -c 'cd system && cargo test --workspace -q'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
        files: ^system/
      - id: device-fixture-generated
        name: system virtual T1 description fixture matches virtual-devices (generate.py --check)
        entry: sh -c 'cd system && python3 crates/opendap-device/fixtures/generate.py --check'
        language: system
        pass_filenames: false
        files: ^system/crates/opendap-device/fixtures/
  # ui/
  - repo: local
    hooks:
      # Generated files are current: each generator's --check fails when its outputs are stale.
      - id: tokens-current
        name: ui design tokens generated (tokens/generate.py --check)
        entry: sh -c 'cd ui && python3 tokens/generate.py --check'
        language: system
        pass_filenames: false
        files: ^ui/(tokens/|export/(slint|css)/|docs/reference/tokens\.md$)
      - id: tokens-tests
        name: ui token reference (tokens/test_generate.py)
        entry: sh -c 'cd ui && python3 -m unittest tokens/test_generate.py'
        language: system
        pass_filenames: false
        files: ^ui/tokens/
      - id: brand-goldens
        name: ui brand generators byte-identical to the committed files (brand/test_goldens.py)
        entry: sh -c 'cd ui && python3 -m unittest brand/test_goldens.py'
        language: system
        pass_filenames: false
        files: ^ui/(brand/|export/brand/|tokens/opendap\.tokens\.json$)
      - id: icons-current
        name: ui icons generated (icons/icons.py --check)
        entry: sh -c 'cd ui && python3 icons/icons.py --check'
        language: system
        pass_filenames: false
        files: ^ui/(icons/|export/icons/|renders/web/icons\.html$)
      - id: icons-tests
        name: ui status glyphs on the pixel grid (icons/test_pixelgrid.py)
        entry: sh -c 'cd ui && python3 -m unittest icons/test_pixelgrid.py'
        language: system
        pass_filenames: false
        files: ^ui/(icons/|export/icons/16/)
      # The requirements README is rendered from requirements.toml and checked.
      - id: requirements-current-ui
        name: ui requirements README rendered (odapkit req render --check)
        entry: sh -c 'cd ui && odapkit req render docs/requirements/requirements.toml --check'
        language: system
        pass_filenames: false
        files: ^ui/docs/requirements/
